[project]
name = "stocks-bot"
version = "0.1.0"
description = "Telegram bot for tracking stock purchases and real dividend yield"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4,<4",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "rapidfuzz>=3.6",
    "apscheduler>=3.10",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "moex: live integration tests that hit iss.moex.com (skip offline with -m 'not moex')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
